name = "tools-api"
main = "src/index.js"
compatibility_date = "2026-09-08"
workers_dev = true
# 保留 Dashboard 中配置的明文变量(部署时不删除/不覆盖不在 toml 中的变量)
keep_vars = true

# ============ 自定义域名路由 (zone: ltools.asia) ============
# 注意: routes 必须在第一个 [table] 之前，否则会被解析为前一个 table 的子字段
routes = [
  { pattern = "ltools.asia/maoyan", zone_name = "ltools.asia" },
  { pattern = "ltools.asia/maoyan/*", zone_name = "ltools.asia" },
  { pattern = "www.ltools.asia/maoyan", zone_name = "ltools.asia" },
  { pattern = "www.ltools.asia/maoyan/*", zone_name = "ltools.asia" },
  { pattern = "ltools.asia/api/*", zone_name = "ltools.asia" },
  { pattern = "www.ltools.asia/api/*", zone_name = "ltools.asia" },
  { pattern = "ltools.asia/store", zone_name = "ltools.asia" },
  { pattern = "www.ltools.asia/store", zone_name = "ltools.asia" },
  { pattern = "ltools.asia/store/*", zone_name = "ltools.asia" },
  { pattern = "www.ltools.asia/store/*", zone_name = "ltools.asia" },
  { pattern = "ltools.asia/store/auth/*", zone_name = "ltools.asia" },
  { pattern = "www.ltools.asia/store/auth/*", zone_name = "ltools.asia" },
  { pattern = "ltools.asia/store/api/*", zone_name = "ltools.asia" },
  { pattern = "www.ltools.asia/store/api/*", zone_name = "ltools.asia" },
  { pattern = "ltools.asia/store/file*", zone_name = "ltools.asia" },
  { pattern = "www.ltools.asia/store/file*", zone_name = "ltools.asia" }
]

[build]
command = "npm run build:assets"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/store", "/store/", "/store/*.html", "/store/auth/*", "/store/api/*", "/store/file*", "/maoyan", "/maoyan/", "/maoyan/*.html"]

# ============ 定时触发 ============
# 猫眼监控、账号维护共用三分钟 cron，具体时段由管理员在 D1 业务策略中配置。
# 表达式保持分钟步进型: check.js 去抖与前端下批次推算依赖 minBatchMinutes 解析,
# 窗口型表达式(如 "*/3 23 * * *")会解析失败回落 10 分钟, 把 3 分钟批次误杀。
# 在每次触发时读取 D1 中的北京时间业务窗口；非对应窗口不启动相关业务。
# 默认值需同步 src/maoyan/cron.js 的 CRON_EXPRESSION，供 API 查询失败时回落。
[triggers]
crons = ["*/3 * * * *"]

# ============ 环境变量 ============
# 公开申请域名与 Site Key 随代码管理；敏感值和其余运行变量保留在 Dashboard。
# keep_vars 可确保部署时不删除未在 toml 中声明的 Dashboard 变量。
[vars]
ENROLLMENT_ORIGIN = "https://ltools.asia"
ENROLLMENT_HOSTNAME = "ltools.asia"
TURNSTILE_SITE_KEY = "0x4AAAAAAE57zkw_Hl1wrTbT"
# CF_ACCOUNT_ID = "4872db2724154d6cbee0709216b70a01"
# LOCK_SERVICE_ENABLED = "true"

# ============ 可观测性(持久化日志) ============
# console 输出可在 Dashboard → Workers → tools-api → Logs 中查询(保留 3 天)
[observability]
enabled = true

# ============ KV 绑定(加密会话 + 影院缓存) ============
# 用户状态(tokens/config/snapshot/changes/seatfb/lock-rule)已迁移 D1, KV 仅保留:
#   maoyan-session 加密会话信封 / cache:cinemas:{cityId} 影院搜索缓存
[[kv_namespaces]]
binding = "MAOYAN_KV"
id = "2027a99d8e934025b3b82ef203c4acff"

# ============ D1 数据库(用户状态全链路) ============
# 上线步骤见 worker/DEPLOY-D1.md: d1 create → d1 execute --file schema.sql → deploy。
[[d1_databases]]
binding = "DB"
database_name = "tools-db"
database_id = "ee66c7c1-58b6-4d95-8f68-d0ff4b092bd2"

[[durable_objects.bindings]]
name = "LOCK_COORDINATOR"
class_name = "LockCoordinator"

[[durable_objects.bindings]]
name = "MONITOR_DISPATCHER"
class_name = "MonitorDispatcher"

[[durable_objects.bindings]]
name = "MONITOR_COORDINATOR"
class_name = "MonitorCoordinator"

[[durable_objects.bindings]]
name = "NOTIFICATION_DISPATCHER"
class_name = "NotificationDispatcher"

[[migrations]]
tag = "v1-maoyan-lock"
new_sqlite_classes = ["LockCoordinator"]

[[migrations]]
tag = "v2-maoyan-monitor-scaling"
new_sqlite_classes = ["MonitorDispatcher", "MonitorCoordinator", "NotificationDispatcher"]

# ADMIN_TOKEN 为 secret(保护 admin 页), 控制台设置或 wrangler secret put 注入
