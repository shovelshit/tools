name: Electron releases

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    paths: ["desktop/**", "pages/maoyan/**", "worker/**", ".github/workflows/electron.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            worker/package-lock.json
      - run: npm --prefix desktop ci
      - run: npm --prefix worker ci
      - run: npm --prefix worker run build:assets
      - run: npm --prefix worker test
      - run: npm --prefix desktop test
      - run: node --test pages/maoyan/*.test.cjs
      - run: npm --prefix desktop run test:e2e -- --output "$RUNNER_TEMP/maoyan-ui-verification"

  prepare_release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Derive release version
        id: version
        shell: bash
        run: |
          base_version="$(node -p "require('./desktop/package.json').version")"
          release_version="${base_version%.*}.${GITHUB_RUN_NUMBER}"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$release_version" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --generate-notes --title "Movie Monitor $RELEASE_TAG"

  package_release:
    needs: prepare_release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare_release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm --prefix desktop ci
      - name: Set application version
        shell: bash
        run: npm --prefix desktop pkg set version="$RELEASE_VERSION"
      - name: Build unsigned macOS arm64 and x64
        if: runner.os == 'macOS'
        run: npm --prefix desktop run package:mac
      - name: Build unsigned Windows x64
        if: runner.os == 'Windows'
        run: npm --prefix desktop run package:win
      - name: Launch packaged local page and verify asar contents
        run: npm --prefix desktop run test:smoke -- --packaged
      - name: SHA-256 macOS release assets
        if: runner.os == 'macOS'
        working-directory: desktop/dist
        run: |
          for asset in maoyan-*.dmg maoyan-*.zip; do
            shasum -a 256 "$asset" > "$asset.sha256"
          done
      - name: Upload macOS release assets
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" desktop/dist/maoyan-*.dmg desktop/dist/maoyan-*.zip desktop/dist/maoyan-*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
      - name: SHA-256 Windows release assets
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop/dist
        run: |
          Get-ChildItem -File | Where-Object { $_.Name -match '^maoyan-.*\.(exe|zip)$' } | ForEach-Object {
            $hashOutput = & certutil -hashfile $_.FullName SHA256
            if ($LASTEXITCODE -ne 0) { throw "certutil failed for $($_.Name)" }
            $hash = $hashOutput | Where-Object { $_ -match '^[0-9a-fA-F]{64}$' }
            if (@($hash).Count -ne 1) { throw "Missing SHA-256 for $($_.Name)" }
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - name: Upload Windows release assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = Get-ChildItem desktop/dist/maoyan-*.exe, desktop/dist/maoyan-*.zip, desktop/dist/maoyan-*.sha256 | ForEach-Object { $_.FullName }
          if (@($assets).Count -eq 0) { throw "No Windows release assets found" }
          gh release upload $env:RELEASE_TAG $assets --clobber --repo $env:GITHUB_REPOSITORY

  publish_release:
    needs: [prepare_release, package_release]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - name: Wait for earlier master releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          while true; do
            prior_run="$(gh api --method GET --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/electron.yml/runs" \
              -f branch=master -f event=push -f per_page=100 \
              --jq ".workflow_runs[] | select((.run_number < $GITHUB_RUN_NUMBER) and (.status != \"completed\")) | .run_number")"
            if [ -z "$prior_run" ]; then
              break
            fi
            echo "Waiting for earlier release run $prior_run"
            sleep 20
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
        shell: bash
        run: |
          newer_success="$(gh api --method GET --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/electron.yml/runs" \
            -f branch=master -f event=push -f per_page=100 \
            --jq ".workflow_runs[] | select((.run_number > $GITHUB_RUN_NUMBER) and (.conclusion == \"success\")) | .run_number")"
          latest_flag="--latest"
          if [ -n "$newer_success" ]; then
            latest_flag="--latest=false"
          fi
          gh release edit "$RELEASE_TAG" --draft=false "$latest_flag" --repo "$GITHUB_REPOSITORY"
      - name: Mirror published assets to Gitee
        if: env.GITEE_TOKEN != ''
        env:
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitee-release"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/gitee-release"
          gitee_release_id="$(curl --fail-with-body -sS -X POST -H 'Accept: application/json' \
            -d "access_token=$GITEE_TOKEN" --data-urlencode "tag_name=$RELEASE_TAG" \
            --data-urlencode "name=Movie Monitor $RELEASE_TAG" --data-urlencode "target_commitish=$GITHUB_SHA" \
            'https://gitee.com/api/v5/repos/aka-ljf/tools/releases' | jq -r '.id // empty')"
          if [ -z "$gitee_release_id" ]; then
            gitee_release_id="$(curl --fail-with-body -sS -H 'Accept: application/json' \
              "https://gitee.com/api/v5/repos/aka-ljf/tools/releases/tags/$RELEASE_TAG?access_token=$GITEE_TOKEN" | jq -r '.id // empty')"
          fi
          if [ -z "$gitee_release_id" ]; then echo "Unable to create or find Gitee release $RELEASE_TAG" >&2; exit 1; fi
          for asset in "$RUNNER_TEMP/gitee-release"/*; do
            curl --fail-with-body -sS -X POST -H 'Accept: application/json' \
              -F "access_token=$GITEE_TOKEN" -F "file=@$asset" \
              "https://gitee.com/api/v5/repos/aka-ljf/tools/releases/$gitee_release_id/attach_files"
          done
      - name: Mirror published assets to Gitee
        if: ${{ secrets.GITEE_TOKEN != '' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare_release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitee-release"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/gitee-release"
          gitee_release_id="$(curl --fail-with-body -sS -X POST \
            -H 'Accept: application/json' \
            -d "access_token=$GITEE_TOKEN" \
            --data-urlencode "tag_name=$RELEASE_TAG" \
            --data-urlencode "name=Movie Monitor $RELEASE_TAG" \
            --data-urlencode "target_commitish=$GITHUB_SHA" \
            'https://gitee.com/api/v5/repos/shovelshit/tools/releases' | jq -r '.id // empty')"
          if [ -z "$gitee_release_id" ]; then
            gitee_release_id="$(curl --fail-with-body -sS \
              -H 'Accept: application/json' \
              "https://gitee.com/api/v5/repos/shovelshit/tools/releases/tags/$RELEASE_TAG?access_token=$GITEE_TOKEN" | jq -r '.id // empty')"
          fi
          if [ -z "$gitee_release_id" ]; then
            echo "Unable to create or find Gitee release $RELEASE_TAG" >&2
            exit 1
          fi
          for asset in "$RUNNER_TEMP/gitee-release"/*; do
            curl --fail-with-body -sS -X POST \
              -H 'Accept: application/json' \
              -F "access_token=$GITEE_TOKEN" \
              -F "file=@$asset" \
              "https://gitee.com/api/v5/repos/shovelshit/tools/releases/$gitee_release_id/attach_files"
          done

  cleanup_release:
    needs: [prepare_release, package_release, publish_release]
    if: ${{ always() && needs.prepare_release.result != 'skipped' && needs.prepare_release.outputs.tag != '' && needs.publish_release.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove incomplete release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
        shell: bash
        run: |
          retry_gh() {
            local attempt
            for attempt in 1 2 3 4; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -eq 4 ]; then
                return 1
              fi
              sleep $((attempt * 2))
            done
          }

          release_id="$(retry_gh gh api --method GET --paginate \
            "repos/$GITHUB_REPOSITORY/releases" -f per_page=100 \
            --jq ".[] | select((.tag_name == \"$RELEASE_TAG\") and (.draft == true)) | .id")" || exit 1
          if [ -z "$release_id" ]; then
            exit 0
          fi

          retry_gh gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id" || exit 1
          tag_exists="$(retry_gh gh api --method GET \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
            --jq "[.[] | select(.ref == \"refs/tags/$RELEASE_TAG\")] | length")" || exit 1
          if [ "$tag_exists" -gt 0 ]; then
            retry_gh gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" || exit 1
          fi
