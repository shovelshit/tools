name: Electron unsigned packages

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths: ["desktop/**", "pages/maoyan/**", "worker/**", ".github/workflows/electron.yml"]
  pull_request:
    paths: ["desktop/**", "pages/maoyan/**", "worker/**", ".github/workflows/electron.yml"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm --prefix desktop ci
      - run: npm --prefix worker test
      - run: npm --prefix desktop test
      - run: node --test pages/maoyan/app.test.cjs pages/maoyan/lock.test.cjs pages/maoyan/runtime.test.cjs
      - name: Build unsigned macOS arm64 and x64
        if: runner.os == 'macOS'
        run: npm --prefix desktop run package:mac
      - name: Build unsigned Windows x64
        if: runner.os == 'Windows'
        run: npm --prefix desktop run package:win
      - name: Launch packaged local page and verify asar contents
        run: npm --prefix desktop run test:smoke -- --packaged
      - name: SHA-256 macOS artifacts
        if: runner.os == 'macOS'
        working-directory: desktop/dist
        run: |
          for artifact in maoyan-*.dmg maoyan-*.zip; do
            shasum -a 256 "$artifact" > "$artifact.sha256"
          done
      - name: SHA-256 Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: desktop/dist
        run: |
          Get-ChildItem -File | Where-Object { $_.Name -match '^maoyan-.*\.(exe|zip)$' } | ForEach-Object {
            $hashOutput = & certutil -hashfile $_.FullName SHA256
            if ($LASTEXITCODE -ne 0) { throw "certutil failed for $($_.Name)" }
            $hash = $hashOutput | Where-Object { $_ -match '^[0-9a-fA-F]{64}$' }
            if (@($hash).Count -ne 1) { throw "Missing SHA-256 for $($_.Name)" }
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: maoyan-unsigned-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/dist/maoyan-*.dmg
            desktop/dist/maoyan-*.zip
            desktop/dist/maoyan-*.exe
            desktop/dist/maoyan-*.sha256
