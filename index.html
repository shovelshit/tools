<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工具箱 · Tools</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #fff;
      --border: #e4e7ec;
      --text: #2c3e50;
      --muted: #8a94a6;
      --primary: #2563eb;
      --shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 55%, #3b82f6 100%);
      color: #fff; padding: 40px 24px 48px; text-align: center;
    }
    header h1 { font-size: 26px; margin-bottom: 8px; }
    header p { color: rgba(255,255,255,.8); font-size: 14px; }
    main { max-width: 860px; margin: -24px auto 0; padding: 0 20px 60px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    a.tool {
      display: block; background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 22px; text-decoration: none; color: var(--text);
      box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s;
    }
    a.tool:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.10); }
    .tool .icon { font-size: 34px; margin-bottom: 12px; }
    .tool h2 { font-size: 16px; margin-bottom: 6px; }
    .tool p { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .tool .tag {
      display: inline-block; margin-top: 12px; font-size: 11px; color: var(--primary);
      background: #eff6ff; border-radius: 20px; padding: 3px 10px;
    }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding-bottom: 30px; }
  </style>
</head>
<body>
  <header>
    <h1>🧰 工具箱</h1>
    <p>静态小工具集合 · 托管于 GitHub Pages，后端由 Cloudflare Workers 提供</p>
  </header>
  <main>
    <div class="grid">
      <a class="tool" href="maoyan/">
        <div class="icon">🎬</div>
        <h2>猫眼场次监控</h2>
        <p>监控影院新增场次，Cloudflare Workers 每 10 分钟自动检查，新增场次 Bark 推送到 iPhone</p>
        <span class="tag">Workers + KV + Cron</span>
      </a>
      <a class="tool" href="store/">
        <div class="icon">📦</div>
        <h2>应用商店</h2>
        <p>浏览和下载 AList 网盘中的应用，经 Cloudflare Workers 反代直连，支持在线预览</p>
        <span class="tag">Workers 反代 AList</span>
      </a>
    </div>
  </main>
  <footer>更多工具陆续添加 · <a href="https://github.com/shovelshit/tools" style="color:inherit">GitHub</a></footer>
</body>
</html>
