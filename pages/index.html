<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9f8" />
    <title>工具箱 · LTools</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #202c2c;
        --muted: #667473;
        --line: #dce4e0;
        --accent: #236c57;
        --surface: #f7f9f8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--surface);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        line-height: 1.6;
      }
      a {
        color: inherit;
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
      .shell {
        width: min(100% - 40px, 780px);
        margin: 0 auto;
      }
      .topbar {
        border-bottom: 1px solid var(--line);
        background: #fff;
      }
      .topbar .shell {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 64px;
      }
      .brand {
        font-size: 15px;
        font-weight: 750;
        text-decoration: none;
        white-space: nowrap;
      }
      .brand-mark {
        color: var(--accent);
        margin-right: 6px;
      }
      .nav-link {
        font-size: 14px;
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
      }
      .nav-link:hover,
      .footer a:hover {
        text-decoration: underline;
      }
      main {
        padding: 64px 0 80px;
      }
      .eyebrow {
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        margin: 0 0 12px;
      }
      h1 {
        font-size: 34px;
        line-height: 1.2;
        margin: 0 0 12px;
        font-weight: 760;
      }
      .intro {
        margin: 0;
        font-size: 15px;
        color: var(--muted);
      }
      .guide-callout {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin: 36px 0 48px;
        padding: 18px 20px;
        background: #eaf4ee;
        border: 1px solid #d0e3d7;
        border-radius: 8px;
        text-decoration: none;
      }
      .guide-callout:hover {
        border-color: var(--accent);
      }
      .guide-callout strong {
        display: block;
        font-size: 15px;
      }
      .guide-callout span {
        display: block;
        color: #557266;
        font-size: 13px;
        margin-top: 2px;
      }
      .guide-arrow {
        color: var(--accent) !important;
        font-size: 20px !important;
        flex: none;
      }
      h2 {
        margin: 0 0 16px;
        font-size: 17px;
      }
      .tools {
        list-style: none;
        padding: 0;
        margin: 0;
        border-top: 1px solid var(--line);
      }
      .tools li {
        border-bottom: 1px solid var(--line);
      }
      .tool {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        padding: 21px 4px;
        text-decoration: none;
      }
      .tool:hover .tool-title {
        color: var(--accent);
      }
      .tool--disabled {
        cursor: default;
        opacity: 0.55;
      }
      .tool--disabled:hover .tool-title {
        color: inherit;
      }
      .tool--disabled .tool-arrow {
        display: none;
      }
      .icon {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 8px;
        font-size: 22px;
        background: #e8eef4;
      }
      .tools li:nth-child(2) .icon {
        background: #f7eee1;
      }
      .tools li:nth-child(3) .icon {
        background: #e6f2ec;
      }
      .tools li:nth-child(4) .icon {
        background: #eeeafb;
      }
      .tool-title {
        display: block;
        font-size: 16px;
        font-weight: 680;
      }
      .tool-detail {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 13px;
      }
      .tool-arrow {
        color: #8a9994;
        font-size: 18px;
      }
      .footer {
        border-top: 1px solid var(--line);
        padding: 20px 0 28px;
        font-size: 12px;
        color: var(--muted);
      }
      .footer .shell {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      @media (max-width: 600px) {
        .shell {
          width: min(100% - 32px, 780px);
        }
        main {
          padding-top: 44px;
          padding-bottom: 60px;
        }
        h1 {
          font-size: 30px;
        }
        .guide-callout {
          margin: 28px 0 40px;
          padding: 16px;
        }
        .tool {
          gap: 12px;
          padding: 18px 0;
        }
        .tool-detail {
          font-size: 12px;
        }
        .footer .shell {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="shell">
        <a class="brand" href="/"
          ><span class="brand-mark" aria-hidden="true">◆</span>LTools</a
        >
        <a class="nav-link" href="https://guide.ltools.asia/">使用教程 ↗</a>
      </div>
    </header>
    <main class="shell">
      <p class="eyebrow">TOOLS / 工具目录</p>
      <h1>工具箱</h1>
      <p class="intro">选择一个工具开始使用。</p>
      <a class="guide-callout" href="https://guide.ltools.asia/"
        ><div>
          <strong>使用教程</strong><span>安装、配置和常见问题，按项目查阅</span>
        </div>
        <span class="guide-arrow" aria-hidden="true">↗</span></a
      >
      <section aria-labelledby="tools-title">
        <h2 id="tools-title">所有工具</h2>
        <ul class="tools">
          <li>
            <a class="tool" href="maoyan/"
              ><span class="icon" aria-hidden="true">🎬</span
              ><span
                ><span class="tool-title">电影场次监控</span
                ><span class="tool-detail"
                  >关注影院排片变化，接收开售提醒，自动锁定座位。</span
                ></span
              ><span class="tool-arrow" aria-hidden="true">↗</span></a
            >
          </li>
          <li>
            <div class="tool tool--disabled" aria-disabled="true">
              <span class="icon" aria-hidden="true">📦</span
              ><span
                ><span class="tool-title">应用商店</span
                ><span class="tool-detail">浏览、预览和下载网盘应用</span></span
              >
            </div>
          </li>
          <li>
            <a
              class="tool"
              href="https://guide.ltools.asia/lynkco-plus"
              target="_blank"
              rel="noopener noreferrer"
              ><span class="icon" aria-hidden="true">🚗</span
              ><span
                ><span class="tool-title">Lynkco-plus 教程</span
                ><span class="tool-detail"
                  >Lynkco-plus 配置教程 · 抓包与 HAR 导出</span
                ></span
              ><span class="tool-arrow" aria-hidden="true">↗</span></a
            >
          </li>
          <li>
            <a
              class="tool"
              href="https://github.com/shovelshit/BLE-debug"
              target="_blank"
              rel="noopener noreferrer"
              ><span class="icon" aria-hidden="true">📶</span
              ><span
                ><span class="tool-title">蓝牙调试助手</span
                ><span class="tool-detail"
                  >扫描和调试 BLE 设备 · GitHub 项目</span
                ></span
              ><span class="tool-arrow" aria-hidden="true">↗</span></a
            >
          </li>
        </ul>
      </section>
    </main>
    <footer class="footer">
      <div class="shell">
        <span>© LTools</span
        ><a
          href="https://github.com/shovelshit/tools"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
      </div>
    </footer>
  </body>
</html>
