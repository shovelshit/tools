<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>访问令牌管理 - 猫眼场次监控</title>
  <link rel="stylesheet" href="style.css?v=20260911h" />
</head>
<body>
  <!-- 管理员登录层 -->
  <div id="admin-login" class="overlay">
    <div class="login-card">
      <div class="login-logo">🛡️</div>
      <h1>访问令牌管理</h1>
      <p class="login-sub">管理员登录 · 新增 / 删除监控页访问令牌</p>
      <div class="form-grid login-grid">
        <label for="admin-worker-url">服务地址</label>
        <input id="admin-worker-url" type="text" placeholder="默认使用本站服务，无需填写" />
        <label for="admin-token-input">管理令牌</label>
        <input id="admin-token-input" type="password" placeholder="部署时设置的管理令牌" autocomplete="off" />
      </div>
      <div id="admin-login-error" class="login-error hidden"></div>
      <button id="btn-admin-login" class="btn primary block">进入管理</button>
      <div class="login-foot muted"><a href="index.html">← 返回监控页</a></div>
    </div>
  </div>

  <!-- 管理主页面: 登录成功后显示 -->
  <div id="admin-main" class="container hidden">
    <header>
      <div class="title-block">
        <h1>访问令牌管理</h1>
        <span class="subtitle">监控页访问令牌的新增、删除与状态查看</span>
      </div>
      <div class="header-right">
        <button id="btn-refresh-tokens" class="btn small ghost">刷新</button>
        <button id="btn-admin-logout" class="btn small ghost">退出登录</button>
        <a class="btn small ghost" href="index.html">🎬 监控页</a>
        <a class="btn small ghost" href="../">🧰 工具箱</a>
      </div>
    </header>

    <section class="card">
      <h2>新增令牌</h2>
      <div class="row">
        <input id="new-token-remark" type="text" placeholder="备注（如：张三的 iPhone）" />
        <input id="new-token-value" type="text" placeholder="自定义令牌（留空自动生成）" autocomplete="off" />
        <button id="btn-add-token" class="btn success">新增</button>
      </div>
      <div class="muted tip-line">令牌留空将自动生成 32 位随机串；新增后请把令牌发给使用者在监控页登录时填写</div>
    </section>

    <section class="card grow">
      <div class="row space-between">
        <h2>令牌列表</h2>
        <span id="token-summary" class="muted"></span>
      </div>
      <div class="token-table-wrap">
        <table class="token-table">
          <thead>
            <tr>
              <th>令牌</th>
              <th>备注</th>
              <th>状态</th>
              <th>创建时间</th>
              <th>最近使用</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="token-tbody">
            <tr><td colspan="6" class="muted empty-tip">加载中...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="secure-store.js?v=20260911h"></script>
  <script src="ui.js?v=20260911h"></script>
  <script src="admin.js?v=20260911h"></script>
</body>
</html>
