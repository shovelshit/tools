<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>账号管理 - 猫眼场次监控</title>
  <link rel="stylesheet" href="style.css?v=20260915d" />
</head>
<body class="admin-page">
  <!-- 管理员登录层 -->
  <div id="admin-login" class="overlay">
    <div class="login-card">
      <div class="login-logo">🛡️</div>
      <h1>账号管理</h1>
      <p class="login-sub">管理员登录</p>
      <div class="form-grid login-grid">
        <label for="admin-worker-url" class="hidden">服务地址</label>
        <input id="admin-worker-url" class="hidden" type="text" placeholder="默认使用本站服务，无需填写" />
        <label for="admin-token-input">管理令牌</label>
        <input id="admin-token-input" type="password" placeholder="部署时设置的管理令牌" autocomplete="off" />
      </div>
      <div id="admin-login-error" class="login-error hidden"></div>
      <button id="btn-admin-login" class="btn primary block">进入管理</button>
      <div class="login-foot muted"><a href="index.html">← 返回监控页</a></div>
    </div>
  </div>

  <!-- 管理主页面: 登录成功后显示 -->
  <div id="admin-main" class="container hidden">
    <header>
      <div class="title-block">
        <h1>账号管理</h1>
        <span class="subtitle">容量、有效期与运行状态</span>
      </div>
      <div class="header-right">
        <button id="btn-refresh-accounts" class="btn small ghost">刷新</button>
        <button id="btn-admin-logout" class="btn small ghost">退出登录</button>
        <a id="btn-enter-monitor" class="btn small ghost" href="index.html">🎬 管理员监控</a>
        <a class="btn small ghost" href="../">🧰 工具箱</a>
      </div>
    </header>

    <section class="admin-toolbar" aria-label="账号容量设置">
      <div class="capacity-meter">
        <span class="muted">普通账号</span>
        <strong id="capacity-summary">-- / --</strong>
      </div>
      <label>名额上限 <input id="capacity-max" type="number" min="0" step="1" /></label>
      <label>默认有效期 <input id="default-valid-days" type="number" min="1" step="1" /><span>天</span></label>
      <label class="admin-toggle"><input id="public-signup-enabled" type="checkbox" /><span>开放申请</span></label>
      <button id="btn-save-settings" class="btn small primary">保存设置</button>
    </section>

    <section class="admin-toolbar" aria-label="新增和筛选账号">
      <div class="admin-create">
        <input id="new-account-remark" type="text" maxlength="50" placeholder="新账号备注" />
        <button id="btn-add-account" class="btn small success">新增账号</button>
      </div>
      <div class="admin-filters">
        <input id="account-search" type="search" placeholder="搜索备注或账号 ID" />
        <select id="account-status-filter" aria-label="账号状态">
          <option value="">全部状态</option>
          <option value="active">有效</option>
          <option value="expired">已到期</option>
          <option value="suspended">已暂停</option>
          <option value="revoked">已撤销</option>
        </select>
      </div>
    </section>

    <section class="admin-table-panel">
      <div class="row space-between">
        <h2>账号列表</h2>
        <span id="account-summary" class="muted"></span>
      </div>
      <div class="token-table-wrap">
        <table class="token-table">
          <thead>
            <tr>
              <th>账号</th>
              <th>资格</th>
              <th>监控</th>
              <th>到期时间</th>
              <th>最近活动</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="account-tbody">
            <tr><td colspan="6" class="muted empty-tip">加载中...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="admin-pagination"><button id="btn-load-more" class="btn small ghost hidden">加载更多</button></div>
    </section>
  </div>

  <script src="secure-store.js?v=20260911u"></script>
  <script src="ui.js?v=20260911u"></script>
  <script src="admin.js?v=20260911u"></script>
</body>
</html>
